<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>9パズル no.3</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #f5f5f5; margin: 0; padding: 10px; touch-action: manipulation; }
  /* 手数と時間の表示エリア */
  #status { font-size: 18px; font-weight: bold; color: #333; margin: 10px 0; display: flex; justify-content: center; gap: 20px; }
  
  #board {
    width: 90vw; height: 90vw; max-width: 360px; max-height: 360px;
    margin: 10px auto; display: grid;
    grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    background: #fff; border: 2px solid #333; gap: 1px;
  }
  .tile {
    width: 100%; height: 100%;
    background-image: url("image-3.jpg"); /* 画像名を image-3.jpg に変更 */
    background-size: 300% 300%;
    background-repeat: no-repeat;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .empty { background: #eee !important; background-image: none !important; }
  button { padding: 12px 24px; font-size: 18px; background: #28a745; color: white; border: none; border-radius: 8px; margin: 5px; cursor: pointer; }
</style>
</head>
<body>
  <h3>9パズル no.3</h3>
  <img src="image-3.jpg" style="width:100px; height:100px; object-fit:cover; border-radius:8px;">
  
  <div id="status">
    <div>手数: <span id="moveCount">0</span></div>
    <div>時間: <span id="timer">0</span>秒</div>
  </div>

  <button id="shuffleBtn">シャッフルして開始！</button>
  <div id="board"></div>

<script>
let tiles = [1, 2, 3, 4, 5, 6, 7, 8, null];
let moveCount = 0;
let seconds = 0;
let timerId = null;

// タイマーを動かす関数
function startTimer() {
  if (timerId) clearInterval(timerId); // すでに動いていたら止める
  seconds = 0;
  document.getElementById("timer").innerText = seconds;
  timerId = setInterval(() => {
    seconds++;
    document.getElementById("timer").innerText = seconds;
  }, 1000);
}

function draw() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  tiles.forEach((n, i) => {
    const d = document.createElement("div");
    d.className = n === null ? "tile empty" : "tile";
    if (n !== null) {
      const x = (n - 1) % 3;
      const y = Math.floor((n - 1) / 3);
      d.style.backgroundPosition = (x * 50) + "% " + (y * 50) + "%";
      d.onclick = () => move(i);
    }
    board.appendChild(d);
  });
  document.getElementById("moveCount").innerText = moveCount;
}

function move(i) {
  const e = tiles.indexOf(null);
  const row = Math.floor(i / 3), col = i % 3;
  const er = Math.floor(e / 3), ec = e % 3;
  
  if (Math.abs(row - er) + Math.abs(col - ec) === 1) {
    [tiles[i], tiles[e]] = [tiles[e], tiles[i]];
    moveCount++; 
    draw();
    
    // クリア判定
    if (tiles.every((v, idx) => v === (idx === 8 ? null : idx + 1))) {
      clearInterval(timerId); // タイマーを止める
      
      // クリアメッセージをランダムで選ぶ
      const messages = [
        "クリアおめでとう！",
        "いつも遊んでくれてありがとう！",
        "クリアできた時ってなんかすっきりするよね！"
      ];
      const randomMsg = messages[Math.floor(Math.random() * messages.length)];
      
      setTimeout(() => {
        alert(randomMsg + "\n\n【記録】\n手数: " + moveCount + "回\n時間: " + seconds + "秒");
      }, 100);
    }
  }
}

function shuffle() {
  moveCount = 0;
  for (let i = 0; i < 150; i++) {
    const e = tiles.indexOf(null);
    const m = [];
    if (e % 3 !== 0) m.push(e - 1);
    if (e % 3 !== 2) m.push(e + 1);
    if (e >= 3) m.push(e - 3);
    if (e < 6) m.push(e + 3);
    const t = m[Math.floor(Math.random() * m.length)];
    [tiles[e], tiles[t]] = [tiles[t], tiles[e]];
  }
  draw();
  startTimer(); // シャッフルしたタイミングでタイマー開始
}

document.getElementById("shuffleBtn").onclick = shuffle;

window.onload = () => {
  draw();
  shuffle();
};
</script>
</body>
</html>
