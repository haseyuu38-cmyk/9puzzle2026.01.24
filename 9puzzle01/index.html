<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ちっくの9パズル no.1</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #f5f5f5; margin: 0; padding: 10px; touch-action: manipulation; }
  
  #board {
    width: 90vw; height: 90vw; max-width: 360px; max-height: 360px;
    margin: 15px auto; display: grid;
    grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    background: #ccc; border: 2px solid #333; gap: 1px;
  }

  .tile {
    width: 100%; height: 100%;
    background-image: url("image.jpg");
    /* 画像サイズを枠の3倍に固定（これだけで3x3になる） */
    background-size: 300% 300%;
    background-repeat: no-repeat;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .empty { background: #ddd !important; background-image: none !important; }

  button { padding: 12px 24px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 8px; margin: 10px; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; justify-content: center; align-items: center; z-index: 100; }
  .clear-box { background: white; padding: 20px; border-radius: 12px; width: 80%; max-width: 300px; }
  .clear-box img { width: 100%; }
</style>
</head>
<body>

<h1>ちっくの9パズル no.1</h1>
<img src="image.jpg" style="width:80px; height:80px; object-fit:cover; border-radius:8px;">
<br>
<button id="shuffleBtn">シャッフル</button>
<div id="board"></div>

<div id="overlay">
  <div class="clear-box">
    <h2>クリア！</h2>
    <img src="image.jpg">
    <br><br>
    <button id="restartBtn">もう一度</button>
  </div>
</div>

<script>
const board = document.getElementById("board");
const overlay = document.getElementById("overlay");
let tiles = [1, 2, 3, 4, 5, 6, 7, 8, null];

// タイルを生成
function createBoard() {
  board.innerHTML = "";
  for (let i = 0; i < 9; i++) {
    const d = document.createElement("div");
    d.id = "t" + i;
    d.onclick = () => move(i);
    board.appendChild(d);
  }
}

// 描画（ここが重要：計算を単純化）
function draw() {
  tiles.forEach((n, i) => {
    const d = document.getElementById("t" + i);
    if (n === null) {
      d.className = "tile empty";
    } else {
      d.className = "tile";
      const x = (n - 1) % 3;
      const y = Math.floor((n - 1) / 3);
      // パーセント指定（0, 50, 100）が最もズレない
      const px = x * 50;
      const py = y * 50;
      d.style.backgroundPosition = px + "% " + py + "%";
    }
  });
}

function move(i) {
  const e = tiles.indexOf(null);
  const row = Math.floor(i / 3), col = i % 3;
  const er = Math.floor(e / 3), ec = e % 3;
  if (Math.abs(row - er) + Math.abs(col - ec) === 1) {
    [tiles[i], tiles[e]] = [tiles[e], tiles[i]];
    draw();
    setTimeout(check, 100);
  }
}

function shuffle() {
  for (let i = 0; i < 150; i++) {
    const e = tiles.indexOf(null);
    const m = [];
    if (e % 3 !== 0) m.push(e - 1);
    if (e % 3 !== 2) m.push(e + 1);
    if (e >= 3) m.push(e - 3);
    if (e < 6) m.push(e + 3);
    const t = m[Math.floor(Math.random() * m.length)];
    [tiles[e], tiles[t]] = [tiles[t], tiles[e]];
  }
  draw();
}

function check() {
  if (tiles.every((n, i) => n === (i === 8 ? null : i + 1))) {
    overlay.style.display = "flex";
  }
}

document.getElementById("shuffleBtn").onclick = shuffle;
document.getElementById("restartBtn").onclick = () => {
  overlay.style.display = "none";
  shuffle();
};

// 起動
window.onload = () => {
  createBoard();
  draw();
  shuffle();
};
</script>
</body>
</html>
