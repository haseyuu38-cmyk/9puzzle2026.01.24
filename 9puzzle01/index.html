<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ちっくの9パズル no.1</title>

<style>
  body {
    font-family: sans-serif;
    text-align: center;
    background: #f5f5f5;
    margin: 0;
    padding: 10px;
    touch-action: manipulation;
  }

  h1 { font-size: 24px; margin: 10px 0; }

  #board {
    width: 90vw;
    max-width: 360px;
    aspect-ratio: 1 / 1;
    margin: 15px auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* Galaxyで安定するgridレイアウト */
    grid-template-rows: repeat(3, 1fr);
    background: #ccc;
    border: 2px solid #333;
    gap: 1px; /* 隙間を1px作ることで境界を明確に */
  }

  .tile {
    width: 100%;
    height: 100%;
    background-image: url("image.jpg");
    background-size: 300% 300%; /* 画像を3倍の大きさにする */
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s;
  }

  /* 空白マスの設定 */
  .tile.empty {
    background: #ddd !important;
    cursor: default;
  }

  button {
    padding: 12px 24px;
    font-size: 18px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
  }

  #overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.8);
    display: none;
    justify-content: center; align-items: center;
    z-index: 100;
  }

  .clear-box { background: white; padding: 20px; border-radius: 12px; width: 80%; max-width: 300px; }
  .clear-box img { width: 100%; border-radius: 5px; }
</style>
</head>
<body>

<h1>ちっくの9パズル no.1</h1>

<img src="image.jpg" style="width:100px; height:100px; object-fit:cover; border-radius:8px; margin-bottom:10px; border: 1px solid #ccc;">
<br>
<button onclick="shuffleAndDraw()">シャッフル</button>

<div id="board"></div>

<div id="overlay">
  <div class="clear-box">
    <h2>クリア！</h2>
    <img src="image.jpg">
    <br><br>
    <button onclick="closeClear()">もう一度</button>
  </div>
</div>

<script>
const board = document.getElementById("board");
const overlay = document.getElementById("overlay");
let tiles = [1, 2, 3, 4, 5, 6, 7, 8, null];

// 最初に一度だけタイル（枠）を作成
function createBoard() {
  board.innerHTML = "";
  for (let i = 0; i < 9; i++) {
    const d = document.createElement("div");
    d.className = "tile";
    d.id = "tile-" + i;
    d.onclick = () => move(i);
    board.appendChild(d);
  }
}

// 描画（中身の背景位置だけを更新）
function draw() {
  tiles.forEach((n, i) => {
    const d = document.getElementById("tile-" + i);
    d.className = "tile"; // クラスリセット
    
    if (n === null) {
      d.classList.add("empty");
      d.style.backgroundImage = "none";
    } else {
      d.style.backgroundImage = 'url("image.jpg")';
      const x = (n - 1) % 3;
      const y = Math.floor((n - 1) / 3);
      // Galaxyの計算ズレを防ぐため、0%, 50%, 100%を明示
      const posX = x === 0 ? "0%" : x === 1 ? "50%" : "100%";
      const posY = y === 0 ? "0%" : y === 1 ? "50%" : "100%";
      d.style.backgroundPosition = `${posX} ${posY}`;
    }
  });
}

function move(i) {
  const e = tiles.indexOf(null);
  const row = Math.floor(i / 3);
  const col = i % 3;
  const er = Math.floor(e / 3);
  const ec = e % 3;

  if (Math.abs(row - er) + Math.abs(col - ec) === 1) {
    [tiles[i], tiles[e]] = [tiles[e], tiles[i]];
    draw();
    setTimeout(check, 100);
  }
}

function shuffleAndDraw() {
  for (let i = 0; i < 300; i++) {
    const e = tiles.indexOf(null);
    const m = [];
    if (e % 3 !== 0) m.push(e - 1);
    if (e % 3 !== 2) m.push(e + 1);
    if (e >= 3) m.push(e - 3);
    if (e < 6) m.push(e + 3);
    const t = m[Math.floor(Math.random() * m.length)];
    [tiles[e], tiles[t]] = [tiles[t], tiles[e]];
  }
  draw();
}

function check() {
  if (tiles.every((n, i) => n === (i === 8 ? null : i + 1))) {
    overlay.style.display = "flex";
  }
}

function closeClear() {
  overlay.style.display = "none";
  shuffleAndDraw();
}

// 起動処理
window.onload = () => {
  createBoard();
  shuffleAndDraw();
};
</script>

</body>
</html>
