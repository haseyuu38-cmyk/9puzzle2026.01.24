<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ちっくの9パズル no.1</title>

<style>
body{font-family:sans-serif;text-align:center;background:#f5f5f5;margin:0;padding:10px;}
#board{width:90vw;max-width:360px;aspect-ratio:1/1;margin:15px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;}
.tile{background-image:url("image.jpg");background-size:300% 300%;cursor:pointer;}
.empty{background:#ddd;}
button{padding:10px 18px;font-size:16px;}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;}
.clear-box{background:white;padding:20px;border-radius:12px;}
.clear-box img{width:100%;max-width:300px;}
</style>
</head>

<body>
<h1>ちっくの9パズル no.1</h1>

<img src="image.jpg" style="width:120px;border-radius:8px;margin-bottom:10px;">

<button onclick="shuffle()">シャッフル</button>
<div id="board"></div>

<div id="overlay">
<div class="clear-box">
<h2>クリア！</h2>
<img src="image.jpg">
<button onclick="closeClear()">もう一度</button>
</div>
</div>

<script>
const board=document.getElementById("board");let tiles=[];
function init(){tiles=[1,2,3,4,5,6,7,8,null];}
function draw(){board.innerHTML="";tiles.forEach((n,i)=>{const d=document.createElement("div");d.className="tile";if(n===null){d.classList.add("empty");}else{const x=(n-1)%3,y=Math.floor((n-1)/3);d.style.backgroundPosition=`${x*-100}% ${y*-100}%`;d.onclick=()=>move(i);}board.appendChild(d);});}
function move(i){const e=tiles.indexOf(null);if((Math.abs(i-e)==1&&Math.floor(i/3)==Math.floor(e/3))||Math.abs(i-e)==3){[tiles[i],tiles[e]]=[tiles[e],tiles[i]];draw();check();}}
function shuffle(){for(let i=0;i<300;i++){const e=tiles.indexOf(null),m=[];if(e%3!==0)m.push(e-1);if(e%3!==2)m.push(e+1);if(e>=3)m.push(e-3);if(e<6)m.push(e+3);const t=m[Math.floor(Math.random()*m.length)];[tiles[e],tiles[t]]=[tiles[t],tiles[e]];}draw();}
function check(){const g=[1,2,3,4,5,6,7,8,null];for(let i=0;i<9;i++){if(tiles[i]!==g[i])return;}overlay.style.display="flex";}
function closeClear(){overlay.style.display="none";shuffle();}
init();shuffle();draw();
</script>
</body>
</html>
