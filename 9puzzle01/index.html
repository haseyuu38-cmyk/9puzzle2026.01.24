<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ちっくの9パズル no.1</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #f5f5f5; margin: 0; padding: 10px; touch-action: manipulation; }
  #board {
    width: 90vw; max-width: 360px; aspect-ratio: 1/1;
    margin: 15px auto; display: grid;
    grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    background: #ccc; border: 2px solid #333; gap: 2px;
  }
  .tile { width: 100%; height: 100%; display: flex; cursor: pointer; -webkit-tap-highlight-color: transparent; background: #fff; }
  .tile img { width: 100%; height: 100%; display: block; }
  .tile.empty { background: #ddd !important; }
  .tile.empty img { display: none; }
  button { padding: 12px 24px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; margin: 10px; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; justify-content: center; align-items: center; z-index: 100; }
  .clear-box { background: white; padding: 20px; border-radius: 12px; width: 80%; max-width: 300px; }
  .clear-box img { width: 100%; border-radius: 5px; }
</style>
</head>
<body>

<h1>ちっくの9パズル no.1</h1>
<img src="image.jpg" style="width:100px; height:100px; object-fit:cover; border-radius:8px; border: 1px solid #ccc;">
<br>
<button onclick="shuffleAndDraw()">シャッフル</button>
<div id="board"></div>

<div id="overlay">
  <div class="clear-box">
    <h2>クリア！</h2>
    <img src="image.jpg">
    <br><br>
    <button onclick="closeClear()">もう一度</button>
  </div>
</div>

<script>
const board = document.getElementById("board");
const overlay = document.getElementById("overlay");
let tiles = [1, 2, 3, 4, 5, 6, 7, 8, null];
const pieceImages = {}; // 分割した画像を保存する場所

// 画像を9分割する関数
function splitImage() {
  const img = new Image();
  img.src = "image.jpg";
  img.onload = () => {
    const size = img.width / 3;
    for (let i = 0; i < 8; i++) {
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      const x = i % 3;
      const y = Math.floor(i / 3);
      // 元画像から切り抜いてキャンバスに描画
      ctx.drawImage(img, x * size, y * size, size, size, 0, 0, size, size);
      pieceImages[i + 1] = canvas.toDataURL("image/jpeg"); // 画像データとして保存
    }
    createBoard();
    shuffleAndDraw();
  };
}

function createBoard() {
  board.innerHTML = "";
  for (let i = 0; i < 9; i++) {
    const d = document.createElement("div");
    d.className = "tile";
    d.id = "tile-" + i;
    d.onclick = () => move(i);
    const imgTag = document.createElement("img");
    d.appendChild(imgTag);
    board.appendChild(d);
  }
}

function draw() {
  tiles.forEach((n, i) => {
    const d = document.getElementById("tile-" + i);
    const img = d.querySelector("img");
    if (n === null) {
      d.classList.add("empty");
      img.src = "";
    } else {
      d.classList.remove("empty");
      img.src = pieceImages[n]; // 分割済み画像を表示
    }
  });
}

function move(i) {
  const e = tiles.indexOf(null);
  const row = Math.floor(i / 3), col = i % 3;
  const er = Math.floor(e / 3), ec = e % 3;
  if (Math.abs(row - er) + Math.abs(col - ec) === 1) {
    [tiles[i], tiles[e]] = [tiles[e], tiles[i]];
    draw();
    setTimeout(check, 100);
  }
}

function shuffleAndDraw() {
  for (let i = 0; i < 200; i++) {
    const e = tiles.indexOf(null);
    const m = [];
    if (e % 3 !== 0) m.push(e - 1);
    if (e % 3 !== 2) m.push(e + 1);
    if (e >= 3) m.push(e - 3);
    if (e < 6) m.push(e + 3);
    const t = m[Math.floor(Math.random() * m.length)];
    [tiles[e], tiles[t]] = [tiles[t], tiles[e]];
  }
  draw();
}

function check() {
  if (tiles.every((n, i) => n === (i === 8 ? null : i + 1))) {
    overlay.style.display = "flex";
  }
}

function closeClear() {
  overlay.style.display = "none";
  shuffleAndDraw();
}

// 実行
splitImage();
</script>
</body>
</html>
