<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>9パズル</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #f5f5f5; margin: 0; padding: 10px; touch-action: manipulation; }
  #board {
    width: 90vw; height: 90vw; max-width: 360px; max-height: 360px;
    margin: 15px auto; display: grid;
    grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    background: #fff; border: 2px solid #333; gap: 1px;
  }
  .tile {
    width: 100%; height: 100%;
    background-image: url("image.jpg");
    background-size: 300% 300%;
    background-repeat: no-repeat;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .empty { background: #eee !important; background-image: none !important; }
  button { padding: 12px 24px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 8px; margin: 5px; }
</style>
</head>
<body>
  <h3>9パズル no.1</h3>
  <img src="image.jpg" style="width:100px; height:100px; object-fit:cover; border-radius:8px;">
  <br>
  <button id="shuffleBtn">シャッフル</button>
  <div id="board"></div>

<script>
let tiles = [1, 2, 3, 4, 5, 6, 7, 8, null];

function draw() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  tiles.forEach((n, i) => {
    const d = document.createElement("div");
    d.className = n === null ? "tile empty" : "tile";
    if (n !== null) {
      const x = (n - 1) % 3;
      const y = Math.floor((n - 1) / 3);
      d.style.backgroundPosition = (x * 50) + "% " + (y * 50) + "%";
      d.onclick = () => move(i);
    }
    board.appendChild(d);
  });
}

function move(i) {
  const e = tiles.indexOf(null);
  const row = Math.floor(i / 3), col = i % 3;
  const er = Math.floor(e / 3), ec = e % 3;
  if (Math.abs(row - er) + Math.abs(col - ec) === 1) {
    [tiles[i], tiles[e]] = [tiles[e], tiles[i]];
    draw();
    if (tiles.every((v, idx) => v === (idx === 8 ? null : idx + 1))) {
      setTimeout(() => alert("クリア！"), 100);
    }
  }
}

function shuffle() {
  for (let i = 0; i < 150; i++) {
    const e = tiles.indexOf(null);
    const m = [];
    if (e % 3 !== 0) m.push(e - 1);
    if (e % 3 !== 2) m.push(e + 1);
    if (e >= 3) m.push(e - 3);
    if (e < 6) m.push(e + 3);
    const t = m[Math.floor(Math.random() * m.length)];
    [tiles[e], tiles[t]] = [tiles[t], tiles[e]];
  }
  draw();
}

document.getElementById("shuffleBtn").onclick = shuffle;

window.onload = () => {
  draw();
  shuffle();
};
</script>
</body>
</html>
