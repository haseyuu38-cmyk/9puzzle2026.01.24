<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ちっくの9パズル no.1</title>

<style>
  body {
    font-family: sans-serif;
    text-align: center;
    background: #f5f5f5;
    margin: 0;
    padding: 10px;
    touch-action: manipulation;
  }

  #board {
    width: 90vw;
    max-width: 360px;
    aspect-ratio: 1 / 1;
    margin: 15px auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    background: #bbb;
    border: 2px solid #333;
    gap: 1px;
    overflow: hidden; /* はみ出し防止 */
  }

  .tile {
    width: 100%;
    height: 100%;
    overflow: hidden; /* 画像のハミ出しをカット */
    background: #fff;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: flex;
  }

  /* 本物の画像タグを制御 */
  .tile img {
    width: 300%;  /* 3枚分（300%）の横幅にする */
    height: 300%; /* 3枚分（300%）の縦幅にする */
    object-fit: none; /* 自動リサイズを無効化 */
    pointer-events: none; /* 画像への直接タップを無効化 */
  }

  .tile.empty {
    background: #ddd;
    cursor: default;
  }

  button {
    padding: 12px 24px;
    font-size: 18px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    margin: 10px;
  }

  #overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.8);
    display: none;
    justify-content: center; align-items: center;
    z-index: 100;
  }

  .clear-box { background: white; padding: 20px; border-radius: 12px; width: 80%; max-width: 300px; }
  .clear-box img { width: 100%; border-radius: 5px; }
</style>
</head>
<body>

<h1>ちっくの9パズル no.1</h1>

<img src="image.jpg" style="width:100px; height:100px; object-fit:cover; border-radius:8px; border: 1px solid #ccc;">
<br>
<button onclick="shuffleAndDraw()">シャッフル</button>

<div id="board"></div>

<div id="overlay">
  <div class="clear-box">
    <h2>クリア！</h2>
    <img src="image.jpg">
    <br><br>
    <button onclick="closeClear()">もう一度</button>
  </div>
</div>

<script>
const board = document.getElementById("board");
const overlay = document.getElementById("overlay");
let tiles = [1, 2, 3, 4, 5, 6, 7, 8, null];

// 最初に一度だけタイル（枠）を作成
function createBoard() {
  board.innerHTML = "";
  for (let i = 0; i < 9; i++) {
    const d = document.createElement("div");
    d.className = "tile";
    d.id = "tile-" + i;
    d.onclick = () => move(i);
    // 枠の中に画像要素を入れる
    const imgElement = document.createElement("img");
    imgElement.src = "image.jpg";
    d.appendChild(imgElement);
    board.appendChild(d);
  }
}

// 描画：画像の表示位置（object-position）を切り替える
function draw() {
  tiles.forEach((n, i) => {
    const d = document.getElementById("tile-" + i);
    const img = d.querySelector("img");
    
    if (n === null) {
      d.classList.add("empty");
      img.style.display = "none";
    } else {
      d.classList.remove("empty");
      img.style.display = "block";
      
      const x = (n - 1) % 3;
      const y = Math.floor((n - 1) / 3);
      
      // object-position で切り抜く位置を指定（0%, 50%, 100%）
      const posX = x === 0 ? "0%" : x === 1 ? "50%" : "100%";
      const posY = y === 0 ? "0%" : y === 1 ? "50%" : "100%";
      img.style.objectPosition = `${posX} ${posY}`;
    }
  });
}

function move(i) {
  const e = tiles.indexOf(null);
  const row = Math.floor(i / 3), col = i % 3;
  const er = Math.floor(e / 3), ec = e % 3;

  if (Math.abs(row - er) + Math.abs(col - ec) === 1) {
    [tiles[i], tiles[e]] = [tiles[e], tiles[i]];
    draw();
    setTimeout(check, 100);
  }
}

function shuffleAndDraw() {
  for (let i = 0; i < 300; i++) {
    const e = tiles.indexOf(null);
    const m = [];
    if (e % 3 !== 0) m.push(e - 1);
    if (e % 3 !== 2) m.push(e + 1);
    if (e >= 3) m.push(e - 3);
    if (e < 6) m.push(e + 3);
    const t = m[Math.floor(Math.random() * m.length)];
    [tiles[e], tiles[t]] = [tiles[t], tiles[e]];
  }
  draw();
}

function check() {
  if (tiles.every((n, i) => n === (i === 8 ? null : i + 1))) {
    overlay.style.display = "flex";
  }
}

function closeClear() {
  overlay.style.display = "none";
  shuffleAndDraw();
}

// 起動処理
window.addEventListener('load', () => {
  createBoard();
  draw();
  // シャッフルは少し遅らせる（描画安定のため）
  setTimeout(shuffleAndDraw, 100);
});
</script>

</body>
</html>
