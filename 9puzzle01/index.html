<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ちっくの9パズル no.1</title>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  background:#f5f5f5;
  margin:0;
  padding:10px;
  touch-action:manipulation;
}

#board{
  width:90vw;
  max-width:360px;
  margin:15px auto;
  display:flex;
  flex-wrap:wrap;
}

.tile{
  width:33.333%;
  position:relative;
  background-image:url("image.jpg");
  box-sizing:border-box;
  border:1px solid #fff;
}

.tile::before{
  content:"";
  display:block;
  padding-top:100%;
}

.empty{
  background:#ddd;
}

button{
  padding:10px 18px;
  font-size:16px;
}

#overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:10;
}

.clear-box{
  background:white;
  padding:20px;
  border-radius:12px;
}

.clear-box img{
  width:100%;
  max-width:300px;
}
</style>
</head>

<body>

<h1>ちっくの9パズル no.1</h1>

<img src="image.jpg" style="width:120px;border-radius:8px;margin-bottom:10px;">

<button onclick="shuffle()">シャッフル</button>

<div id="board"></div>

<div id="overlay">
  <div class="clear-box">
    <h2>クリア！</h2>
    <img src="image.jpg">
    <button onclick="closeClear()">もう一度</button>
  </div>
</div>

<script>
const board=document.getElementById("board");
const overlay=document.getElementById("overlay");
let tiles=[];
const img=new Image();
img.src="image.jpg";
img.onload=()=>start();

function start(){
  init();
  shuffle();
  draw();
}

function init(){
  tiles=[1,2,3,4,5,6,7,8,null];
}

function draw(){
  const size = board.clientWidth / 3;
  board.innerHTML="";

  tiles.forEach((n,i)=>{
    const d=document.createElement("div");
    d.className="tile";

    if(n===null){
      d.classList.add("empty");
    }else{
      const x=(n-1)%3;
      const y=Math.floor((n-1)/3);

      d.style.backgroundSize = board.clientWidth+"px "+board.clientWidth+"px";
      d.style.backgroundPosition = `-${x*size}px -${y*size}px`;
      d.onclick=()=>move(i);
    }

    board.appendChild(d);
  });
}

function move(i){
  const e=tiles.indexOf(null);

  if(
    (Math.abs(i-e)==1 && Math.floor(i/3)==Math.floor(e/3)) ||
    Math.abs(i-e)==3
  ){
    [tiles[i],tiles[e]]=[tiles[e],tiles[i]];
    draw();
    check();
  }
}

function shuffle(){
  for(let i=0;i<300;i++){
    const e=tiles.indexOf(null);
    const m=[];
    if(e%3!==0)m.push(e-1);
    if(e%3!==2)m.push(e+1);
    if(e>=3)m.push(e-3);
    if(e<6)m.push(e+3);
    const t=m[Math.floor(Math.random()*m.length)];
    [tiles[e],tiles[t]]=[tiles[t],tiles[e]];
  }
}

function check(){
  const g=[1,2,3,4,5,6,7,8,null];
  for(let i=0;i<9;i++){
    if(tiles[i]!==g[i])return;
  }
  overlay.style.display="flex";
}

function closeClear(){
  overlay.style.display="none";
  shuffle();
  draw();
}
</script>

</body>
</html>
